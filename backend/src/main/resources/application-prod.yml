server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ensp_nms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${AUTH_CORS_ORIGINS}

logging:
  level:
    root: info
    com.ensp.nms: info
