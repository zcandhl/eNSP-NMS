# 教师机无 Docker 原生部署
# 启动：java -jar app.jar --spring.profiles.active=native
server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ensp_nms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:ensp-nms-native-change-me-secret-32b}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS:86400000}
  cors:
    # 前后端同端口（JAR 托管 web/）时同源
    allowed-origins: ${AUTH_CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

logging:
  level:
    root: info
    com.ensp.nms: info

snmp:
  trap:
    port: ${SNMP_TRAP_PORT:162}

# 前端构建产物目录（相对 JAR 工作目录），见 deploy/native/
nms:
  web:
    static-dir: ${NMS_WEB_STATIC_DIR:./web}
