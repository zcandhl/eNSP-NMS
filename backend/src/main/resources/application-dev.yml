server:
  port: 8080
  tomcat:
    connection-timeout: 300000
    keep-alive-timeout: 300000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ensp_nms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

influxdb:
  url: http://localhost:8086
  token: your-influxdb-token
  org: ensp-nms
  bucket: performance

snmp:
  community: public
  port: 161
  trap:
    port: 162
    v3:
      enabled: true
      users:
        - username: nmsuser
          auth-protocol: SHA
          auth-password: AuthPass123
          priv-protocol: AES128
          priv-password: PrivPass123

logging:
  level:
    com.ensp.nms: debug
